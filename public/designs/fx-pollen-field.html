<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX B · 花粉场 Pollen Field + cursor</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  body{background:#F4EFE3;color:#2A2620;font-family:"Noto Serif SC",serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  h1{font-weight:600;letter-spacing:.25em;font-size:clamp(1.4rem,4vw,2.2rem)}
  p{color:#6B6252;font-size:.9rem;margin-top:.9rem;line-height:1.9}
  .latin{font-family:"Cormorant Garamond",serif;letter-spacing:.35em;color:#C9A45C;font-size:.85rem;margin-top:.4rem}
  a.back{position:fixed;top:1.4rem;left:1.6rem;color:#8A6A26;font-family:monospace;font-size:.72rem;letter-spacing:.2em;text-decoration:none;z-index:5}
  canvas{position:fixed;inset:0;z-index:0}
  main{position:relative;z-index:2;pointer-events:none}
</style>
</head>
<body>
<a class="back" href="index.html">← LAB</a>
<canvas id="c"></canvas>
<main>
  <h1>草木花粉 · 场</h1>
  <div class="latin">FX B · POLLEN FIELD · AMBIENT + ATTRACT</div>
  <p>整屏常驻花粉缓慢漂流；指尖经过时，花粉向指尖聚拢再弹开——共感。<br>研究出处：firefly.js 萤火、CSS fireflies、ambient field 粒子。</p>
</main>
<script>
var cvs = document.getElementById("c"), ctx = cvs.getContext("2d");
var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function size(){ cvs.width=innerWidth*devicePixelRatio; cvs.height=innerHeight*devicePixelRatio; }
size(); addEventListener("resize", size);

var N=90, seeds=[];
for (var i=0;i<N;i++) seeds.push({
  x: Math.random()*cvs.width, y: Math.random()*cvs.height,
  vx:(Math.random()-.5)*.25*devicePixelRatio, vy:(Math.random()-.5)*.25*devicePixelRatio,
  r:(0.8+Math.random()*2.2)*devicePixelRatio,
  tw: Math.random()*Math.PI*2, twV: 0.008+Math.random()*0.02,
  k: Math.random()  // attract coefficient per seed
});
var mx=-9999,my=-9999;
addEventListener("pointermove",function(e){mx=e.clientX*devicePixelRatio;my=e.clientY*devicePixelRatio;});
addEventListener("pointerleave",function(){mx=my=-9999});

function frame(t){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  for(var s of seeds){
    s.tw += s.twV;
    // ambient drift
    s.vx += (Math.random()-.5)*0.02*devicePixelRatio;
    s.vy += (Math.random()-.5)*0.02*devicePixelRatio;
    // cursor attraction/repulsion within radius
    var dx = mx-s.x, dy = my-s.y, d2 = dx*dx+dy*dy;
    if (d2 < 240*240*devicePixelRatio*devicePixelRatio){
      var d = Math.sqrt(d2)||1;
      var f = s.k * 0.028 * devicePixelRatio;     // attract toward cursor
      if (d < 60*devicePixelRatio) f = -f*2.2;    // then repel: the "scat!" moment
      s.vx += (dx/d)*f; s.vy += (dy/d)*f;
    }
    s.vx *= 0.98; s.vy *= 0.98;
    s.x += s.vx; s.y += s.vy;
    if (s.x<0) s.x=cvs.width; if (s.x>cvs.width) s.x=0;
    if (s.y<0) s.y=cvs.height; if (s.y>cvs.height) s.y=0;
    var glow = 0.35 + 0.4*Math.abs(Math.sin(s.tw));
    ctx.beginPath();
    ctx.fillStyle = "rgba(143,176,110," + (glow*0.75) + ")";
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.fillStyle = "rgba(201,164,92," + (glow*0.22) + ")";
    ctx.arc(s.x, s.y, s.r*3.2, 0, Math.PI*2);  // soft halo bloom
    ctx.fill();
  }
  if (!reduced) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
