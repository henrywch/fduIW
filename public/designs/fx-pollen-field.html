<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX B · 花粉场 Pollen Field + cursor</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  body{background:#F4EFE3;color:#2A2620;font-family:"Noto Serif SC",serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  h1{font-weight:600;letter-spacing:.25em;font-size:clamp(1.4rem,4vw,2.2rem)}
  p{color:#6B6252;font-size:.9rem;margin-top:.9rem;line-height:1.9}
  .latin{font-family:"Cormorant Garamond",serif;letter-spacing:.35em;color:#C9A45C;font-size:.85rem;margin-top:.4rem}
  a.back{position:fixed;top:1.4rem;left:1.6rem;color:#8A6A26;font-family:monospace;font-size:.72rem;letter-spacing:.2em;text-decoration:none;z-index:5}
  canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  main{position:relative;z-index:2;pointer-events:none}
</style>
</head>
<body>
<a class="back" href="index.html">← LAB</a>
<canvas id="c"></canvas>
<main>
  <h1>草木花粉 · 场</h1>
  <div class="latin">FX B · POLLEN FIELD · AMBIENT + ATTRACT</div>
  <p>整屏常驻花粉缓慢漂流（慢正弦漫游取代白噪声抖动——响而不噪）；指尖进入约 150px 半径时，花粉快速向指尖聚拢再弹开——共感。<br>研究出处：firefly.js 萤火、Rauno Freiberg 交互半径（~150px soft decay）、thread C-2「responsive, not noisy」；粗糙指针下仅剩纯漂流。</p>
</main>
<script>
var cvs = document.getElementById("c"), ctx = cvs.getContext("2d");
var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
// touch-only devices: no cursor layer at all, the field stays pure ambience
var finePtr = matchMedia("(pointer: fine)").matches || matchMedia("(any-pointer: fine)").matches;
var DPR = Math.min(devicePixelRatio || 1, 2);
function size(){ cvs.width = innerWidth * DPR; cvs.height = innerHeight * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
size(); addEventListener("resize", size);

var N = finePtr ? 90 : 60, seeds = [];   // visible count stays ≤ ~90 — overdraw, not count, is the cost (bloom halo ×2)
for (var i=0;i<N;i++) seeds.push({
  x: Math.random()*innerWidth, y: Math.random()*innerHeight,
  vx:(Math.random()-.5)*.2, vy:(Math.random()-.5)*.2,
  r: 0.8+Math.random()*2.2,
  tw: Math.random()*Math.PI*2, twV: 0.008+Math.random()*0.02,
  wq: 0.3+Math.random()*0.6, wph: Math.random()*Math.PI*2,   // slow wander; no per-frame jitter
  k: Math.random()  // attract coefficient per seed
});
// events record the target; the frame loop tracks it with only a light lerp (≈3-frame catch-up)
var mT = [-9999, -9999], m = [-9999, -9999];
if (finePtr) {
  addEventListener("pointermove", function(e){ mT[0]=e.clientX; mT[1]=e.clientY; }, { passive: true });
  addEventListener("pointerleave", function(){ mT[0]=mT[1]=-9999; });
}

var RADIUS = 150, last = performance.now();   // ~150px of influence (rauno.me reference)
function frame(t){
  var dt = Math.min((t-last)/16.7, 3); last = t;
  m[0] += (mT[0]-m[0]) * 0.35; m[1] += (mT[1]-m[1]) * 0.35;
  ctx.clearRect(0,0,innerWidth,innerHeight);
  for (var s of seeds){
    s.tw += s.twV * dt;
    // ambient drift: slow sine wander instead of white-noise kicks
    s.vx += Math.sin(t*0.0004*s.wq + s.wph) * 0.006 * dt;
    s.vy += Math.cos(t*0.00037*s.wq + s.wph) * 0.006 * dt;
    // cursor attraction/repulsion within the radius of influence
    var dx = m[0]-s.x, dy = m[1]-s.y, d2 = dx*dx+dy*dy;
    if (d2 < RADIUS*RADIUS){
      var d = Math.sqrt(d2)||1;
      var f = s.k * 0.028;       // attract toward cursor
      if (d < 46) f = -f*2.2;    // then repel: the "scat!" moment
      s.vx += (dx/d)*f*dt; s.vy += (dy/d)*f*dt;
    }
    s.vx *= 0.985; s.vy *= 0.985;
    var sp = Math.sqrt(s.vx*s.vx + s.vy*s.vy), cap = 0.6;   // hard speed cap: responsive, not noisy
    if (sp > cap){ s.vx *= cap/sp; s.vy *= cap/sp; }
    s.x += s.vx*dt; s.y += s.vy*dt;
    if (s.x<0) s.x=innerWidth; if (s.x>innerWidth) s.x=0;
    if (s.y<0) s.y=innerHeight; if (s.y>innerHeight) s.y=0;
    var glow = 0.35 + 0.4*Math.abs(Math.sin(s.tw));
    ctx.beginPath();
    ctx.fillStyle = "rgba(143,176,110," + (glow*0.75) + ")";
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.fillStyle = "rgba(201,164,92," + (glow*0.22) + ")";
    ctx.arc(s.x, s.y, s.r*3.2, 0, Math.PI*2);  // soft halo bloom
    ctx.fill();
  }
  if (!reduced) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
