<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX C · 共感丝线 Empathy Threads (cursor)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  body{background:#191D2A;color:#E8E2D4;font-family:"Noto Serif SC",serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  h1{font-weight:600;letter-spacing:.25em;font-size:clamp(1.4rem,4vw,2.2rem)}
  p{color:#9A927E;font-size:.9rem;margin-top:.9rem;line-height:1.9}
  .latin{font-family:"Cormorant Garamond",serif;letter-spacing:.35em;color:#E0C07A;font-size:.85rem;margin-top:.4rem}
  a.back{position:fixed;top:1.4rem;left:1.6rem;color:#E0C07A;font-family:monospace;font-size:.72rem;letter-spacing:.2em;text-decoration:none;z-index:5}
  canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  main{position:relative;z-index:2;pointer-events:none}
  .stars span{position:fixed;background:#E8E2D4;border-radius:50%;opacity:.55;animation:tw 3s ease-in-out infinite}
  @keyframes tw{50%{opacity:.12}}
  @media (prefers-reduced-motion: reduce){ .stars span{animation:none} }
</style>
</head>
<body>
<a class="back" href="index.html">← LAB</a>
<div class="stars" id="stars"></div>
<canvas id="c"></canvas>
<main>
  <h1>共感 · 丝线</h1>
  <div class="latin">FX C · EMPATHY THREADS</div>
  <p>星辰是花圃中的社员——指尖所向，金线即时牵去，线端只留一线 lerp 余韵，微弯如笔意。<br>研究出处：「共感」律法意象 + plexus/constellation web 经典星线结构；粗糙指针下仅余星光闪烁。</p>
</main>
<script>
var cvs=document.getElementById("c"), ctx=cvs.getContext("2d");
var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
var finePtr = matchMedia("(pointer: fine)").matches || matchMedia("(any-pointer: fine)").matches;
var DPR = Math.min(devicePixelRatio||1, 2);
function size(){cvs.width=innerWidth*DPR;cvs.height=innerHeight*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
size(); addEventListener("resize", size);

// fixed "stars" — the friars (CSS-px coordinates after the transform)
var N=26, nodes=[];
var starLayer = document.getElementById("stars");
for (var i=0;i<N;i++){
  nodes.push({
    x: Math.random()*innerWidth, y: Math.random()*innerHeight,
    r: 1.2+Math.random()*1.8,
    tw: Math.random()*Math.PI*2
  });
  var dot=document.createElement("span");
  var sz=(2+Math.random()*2);
  dot.style.cssText="width:"+sz+"px;height:"+sz+"px;left:"+nodes[i].x+"px;top:"+nodes[i].y+"px;animation-delay:"+(Math.random()*3)+"s";
  starLayer.appendChild(dot);
}
addEventListener("resize",function(){
  starLayer.innerHTML="";
  nodes.forEach(function(n){
    n.x=Math.random()*innerWidth; n.y=Math.random()*innerHeight;
    var dot=document.createElement("span"); var sz=2+Math.random()*2;
    dot.style.cssText="width:"+sz+"px;height:"+sz+"px;left:"+n.x+"px;top:"+n.y+"px;animation-delay:"+(Math.random()*3)+"s";
    starLayer.appendChild(dot);
  });
});

// threads follow the cursor essentially directly — a light 0.5 lerp keeps the
// tip from stair-stepping without ever lagging a gesture behind
var mT=[-1e4,-1e4], m=[-1e4,-1e4];
if (finePtr){
  addEventListener("pointermove",function(e){mT[0]=e.clientX;mT[1]=e.clientY;},{passive:true});
  addEventListener("pointerleave",function(){mT[0]=mT[1]=-1e4;});
}

function frame(t){
  m[0]+=(mT[0]-m[0])*0.5; m[1]+=(mT[1]-m[1])*0.5;
  ctx.clearRect(0,0,innerWidth,innerHeight);
  for(var n of nodes){
    // star twinkle halo
    var a = 0.18 + 0.14*Math.sin(t*0.002 + n.tw);
    ctx.beginPath(); ctx.fillStyle="rgba(224,192,122,"+a+")";
    ctx.arc(n.x,n.y,n.r*3,0,Math.PI*2); ctx.fill();
    // thread to cursor when close
    var dx=m[0]-n.x, dy=m[1]-n.y, d=Math.sqrt(dx*dx+dy*dy), R=300;
    if (d < R){
      ctx.beginPath();
      ctx.strokeStyle="rgba(224,192,122,"+(0.5*(1-d/R))+")";
      ctx.lineWidth=0.7;
      ctx.moveTo(n.x,n.y);
      // slight curve toward cursor for the "drawn thread" feel
      var cx=(n.x+m[0])/2 + dy*0.08, cy=(n.y+m[1])/2 - dx*0.08;
      ctx.quadraticCurveTo(cx,cy,m[0],m[1]); ctx.stroke();
    }
    // node-node neighbors: faint permanent web
    for (var o of nodes){ if (o===n) continue;
      var ddx=o.x-n.x, ddy=o.y-n.y, dd=Math.sqrt(ddx*ddx+ddy*ddy), RR=140;
      if (dd<RR && n.x<o.x){
        ctx.beginPath();
        ctx.strokeStyle="rgba(143,176,137,"+(0.10*(1-dd/RR))+")";
        ctx.lineWidth=0.6;
        ctx.moveTo(n.x,n.y); ctx.lineTo(o.x,o.y); ctx.stroke();
      }
    }
  }
  if (!reduced) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
