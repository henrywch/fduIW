<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX A · 风舞花瓣 Breeze Petals</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  body{background:#161A26;color:#E8E2D4;font-family:"Noto Serif SC",serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  h1{font-weight:600;letter-spacing:.25em;font-size:clamp(1.4rem,4vw,2.2rem)}
  p{color:#9A927E;font-size:.9rem;margin-top:.9rem;letter-spacing:.06em;line-height:1.9}
  .latin{font-family:"Cormorant Garamond",serif;letter-spacing:.35em;color:#E0C07A;font-size:.85rem;margin-top:.4rem}
  a.back{position:fixed;top:1.4rem;left:1.6rem;color:#E0C07A;font-family:monospace;font-size:.72rem;letter-spacing:.2em;text-decoration:none;z-index:5}
  canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  main{position:relative;z-index:2}
</style>
</head>
<body>
<a class="back" href="index.html">← LAB</a>
<canvas id="c"></canvas>
<main>
  <h1>风舞 · 瓣</h1>
  <div class="latin">FX A · BREEZE PETALS · 2 DEPTH BANDS</div>
  <p>两条深度带（远＝小·淡·慢，风感弱；近＝大·亮·快）+ 一条共享低频风正弦——像天气，不像雨；<br>每片花瓣自有相位、翻滚与二次微颤，下落速度随尺寸。研究出处：jhammann/sakura、CodePen 风场粒子、thread C-1。</p>
</main>
<script>
var cvs = document.getElementById("c"), ctx = cvs.getContext("2d");
var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
var DPR = Math.min(devicePixelRatio || 1, 2);   // research: cap DPR at 2 — overdraw, not count, is the cost
function size(){ cvs.width = innerWidth * DPR; cvs.height = innerHeight * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
size(); addEventListener("resize", size);

// two depth bands; all coordinates in CSS px after the transform
var N_FAR = 16, N_NEAR = 10, petals = [];
function spawn(init, far){
  var r = far ? (1.6 + Math.random()*1.8) : (3.2 + Math.random()*4.2);
  return {
    far: far,
    x: Math.random()*innerWidth,
    y: init ? Math.random()*innerHeight : -30,
    r: r,
    vy: (far ? 0.22 : 0.4) + Math.random()*0.3 + r*0.07,  // fall speed tied to size
    phase: Math.random()*Math.PI*2,        // sway phase
    phaseV: 0.006 + Math.random()*0.010,   // sway frequency
    tumble: Math.random()*Math.PI*2,       // 3d tumble angle
    tumbleV: (Math.random()-.5)*0.05,      // tumble rate
    wq: 0.4 + Math.random()*0.5, wph: Math.random()*Math.PI*2,  // slow secondary wobble
    hue: Math.random(),
  };
}
for (var i=0;i<N_FAR+N_NEAR;i++) petals.push(spawn(true, i < N_FAR));

// shared weather wind: two low sines + a fast whisper — breathing, not a fixed breeze
function wind(t, y){
  return Math.sin(t*0.0007 + y*0.002) * 0.45
       + Math.sin(t*0.00018 + 2.0) * 0.6
       + Math.sin(t*0.0031) * 0.08;
}

var last = performance.now();
function frame(t){
  var dt = Math.min((t - last)/16.7, 3);   // clamp: no lurch returning from a background tab
  last = t;
  ctx.clearRect(0,0,innerWidth,innerHeight);
  for (var p of petals){
    p.phase += p.phaseV * dt;
    p.tumble += p.tumbleV * dt;
    var w = wind(t, p.y) * (p.far ? 0.4 : 1);   // the far band barely feels the wind
    p.x += (w + Math.sin(p.phase)*0.4) * dt;
    p.y += p.vy * (0.85 + Math.sin(p.phase*0.7)*0.3) * dt;
    if (p.y > innerHeight + 40) { Object.assign(p, spawn(false, p.far)); continue; }
    if (p.x < -60) p.x = innerWidth + 50;
    if (p.x > innerWidth + 60) p.x = -50;

    // sakura-petal silhouette: rounded lobes, small notch at the tip; the
    // tumble squish narrows the blade as it turns edge-on (rotateY feel)
    var squish = Math.cos(p.tumble);             // 1..-1
    var rot = Math.sin(p.phase) * 0.6 + Math.sin(t*0.001*p.wq + p.wph) * 0.25;  // sway + secondary wobble
    var shade = 0.25 + 0.45*Math.abs(squish);    // edge-on petals fade
    var alpha = p.far ? shade*0.45 : shade;      // far = dim
    var r = p.hue < 0.6 ? "224,192,122" : (p.hue < 0.85 ? "242,226,216" : "205,122,100");  // gold / blush / madder
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(rot);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "rgba(" + r + ",1)";
    var w2 = p.r * 0.85 * Math.max(0.14, Math.abs(squish)), nd = p.r * 0.16;
    ctx.beginPath();
    ctx.moveTo(0, -p.r + nd);
    ctx.bezierCurveTo(w2*0.65, -p.r*1.08, w2*1.25, -p.r*0.3, w2*0.8, p.r*0.28);
    ctx.bezierCurveTo(w2*0.55, p.r*0.72, w2*0.2, p.r*0.95, 0, p.r);
    ctx.bezierCurveTo(-w2*0.2, p.r*0.95, -w2*0.55, p.r*0.72, -w2*0.8, p.r*0.28);
    ctx.bezierCurveTo(-w2*1.25, -p.r*0.3, -w2*0.65, -p.r*1.08, 0, -p.r + nd);
    ctx.fill();
    // soft center vein
    ctx.globalAlpha = alpha * 0.35;
    ctx.strokeStyle = "rgba(122,88,52,1)";
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(0, p.r*0.85);
    ctx.quadraticCurveTo(w2*0.1, p.r*0.1, 0, -p.r*0.55);
    ctx.stroke();
    ctx.restore();
  }
  if (!reduced) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);   // reduced motion: one still drift of petals, then no loop
</script>
</body>
</html>
