<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX D · 祈尘 Censer Dust (cursor)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  body{background:#161A26;color:#E8E2D4;font-family:"Noto Serif SC",serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  h1{font-weight:600;letter-spacing:.25em;font-size:clamp(1.4rem,4vw,2.2rem)}
  p{color:#9A927E;font-size:.9rem;margin-top:.9rem;line-height:1.9}
  .latin{font-family:"Cormorant Garamond",serif;letter-spacing:.35em;color:#E0C07A;font-size:.85rem;margin-top:.4rem}
  a.back{position:fixed;top:1.4rem;left:1.6rem;color:#E0C07A;font-family:monospace;font-size:.72rem;letter-spacing:.2em;text-decoration:none;z-index:5}
  canvas{position:fixed;inset:0;z-index:0}
  main{position:relative;z-index:2;pointer-events:none}
</style>
</head>
<body>
<a class="back" href="index.html">← LAB</a>
<canvas id="c"></canvas>
<main>
  <h1>祈尘 · 上行</h1>
  <div class="latin">FX D · CENSER DUST · STILL RISE, CURSOR DRAWS</div>
  <p>静止时香尘自然上升；指尖划过之处，尘随轨迹旋起又散——生成改由 rAF 采样：9px 距离阈值、单帧预算 ≤5、沿步长插值，疾挥不成墙。<br>研究出处：gooey/liquid cursor 轨迹、烟雾上升模型、thread C-2（rAF-sampled, velocity-threshold spawn）。</p>
</main>
<script>
var cvs=document.getElementById("c"), ctx=cvs.getContext("2d");
var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
var coarse = matchMedia("(pointer: coarse)").matches;
var DPR = Math.min(devicePixelRatio||1, 2);
function size(){
  cvs.width=innerWidth*DPR; cvs.height=innerHeight*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);      // canvas resize resets context state — re-apply both
  ctx.globalCompositeOperation="lighter"; // dark bg: particles add light
}
size(); addEventListener("resize", size);

var CAP = 360, parts=[];
function seed(x,y,ambient,ix,iy){
  parts.push({
    x:x,y:y,
    vx:(ix||0)*0.06 + (Math.random()-.5)*0.35,   // cursor dust inherits a whiff of the stroke
    vy: ambient ? (-0.15-Math.random()*0.35) : (-0.3-Math.random()*0.6),
    r: 1.8+Math.random()*3.4,
    life:1, decay: ambient ? 0.0008+Math.random()*0.0014 : 0.009+Math.random()*0.009,
    warm: Math.random()<0.7
  });
}
// prefill the whole canvas so the field is alive from frame one
for (var j=0;j<70;j++) seed(Math.random()*innerWidth, Math.random()*innerHeight, true);

// events only record the latest position; spawning happens in the frame loop
var tX=-1,tY=-1,sX=-1,sY=-1,acc=0,have=false;
if (!coarse){
  addEventListener("pointermove",function(e){ tX=e.clientX; tY=e.clientY; have=true; },{passive:true});
  addEventListener("pointerleave",function(){ have=false; sX=sY=-1; });
}

function frame(t){
  // slow ambient spawn: always something rising
  if (!reduced && Math.random() < 0.55 && parts.length < CAP) {
    seed(Math.random()*innerWidth, innerHeight + 10, true);
  }
  // distance-threshold spawns with a velocity-scaled per-frame budget
  if (have){
    if (sX<0){ sX=tX; sY=tY; }
    var dx=tX-sX, dy=tY-sY, v=Math.hypot(dx,dy);
    acc+=v;
    var budget = v>40 ? 5 : v>16 ? 3 : 1, n=0;
    while (acc>=9 && n<budget && parts.length<CAP){
      acc-=9; n++;
      var k = 1 - acc/(v||1);   // walk along this frame's movement, oldest step first
      seed(sX+dx*k + (Math.random()-.5)*8, sY+dy*k + (Math.random()-.5)*8, false, dx, dy);
    }
    sX=tX; sY=tY;
  }
  if (parts.length>CAP) parts.splice(0, parts.length-CAP);  // evict oldest, never grow unbounded
  ctx.clearRect(0,0,innerWidth,innerHeight);
  for (var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    // gentle spiraling while rising
    p.x += p.vx + Math.sin(t*0.001 + p.y*0.01)*0.3;
    p.y += p.vy;
    p.life -= p.decay;
    if (p.life<=0 || p.y < -20){ parts.splice(i,1); continue; }
    var a = p.life * (p.warm?0.65:0.5);
    var c = p.warm ? "224,192,122" : "143,176,137";
    ctx.beginPath(); ctx.fillStyle="rgba("+c+","+a+")";
    ctx.arc(p.x, p.y, p.r*p.life + 1, 0, Math.PI*2); ctx.fill();
  }
  if (!reduced) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// one frame so reduced-motion gets a static dusting
for (var z=0;z<40;z++) frame(0);
</script>
</body>
</html>
