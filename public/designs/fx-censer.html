<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX D · 祈烟 Incense Smoke (cursor)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  body{background:#161A26;color:#E8E2D4;font-family:"Noto Serif SC",serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  h1{font-weight:600;letter-spacing:.25em;font-size:clamp(1.4rem,4vw,2.2rem)}
  p{color:#9A927E;font-size:.9rem;margin-top:.9rem;line-height:1.9}
  .latin{font-family:"Cormorant Garamond",serif;letter-spacing:.35em;color:#E0C07A;font-size:.85rem;margin-top:.4rem}
  a.back{position:fixed;top:1.4rem;left:1.6rem;color:#E0C07A;font-family:monospace;font-size:.72rem;letter-spacing:.2em;text-decoration:none;z-index:5}
  canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  main{position:relative;z-index:2;pointer-events:none}
</style>
</head>
<body>
<a class="back" href="index.html">← LAB</a>
<canvas id="c"></canvas>
<main>
  <h1>祈烟 · 随指</h1>
  <div class="latin">FX D · INCENSE WISP · CURSOR DRAWN</div>
  <p>没有常驻气泡——烟只随指尖而起：沿本帧行程盖下柔软的烟团，初速承自笔势又迅速散去，<br>随年岁膨胀、转凉、被湍流打散成三缕。静止时只留一线细烟。研究出处：PavelDoGreat fluid-sim 喷溅参量、zlollo realistic-webgl-smoke 线香模型、teolitto 精灵图烟团法。</p>
</main>
<script>
var cvs = document.getElementById("c"), ctx = cvs.getContext("2d");
var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
var finePtr = matchMedia("(pointer: fine)").matches || matchMedia("(any-pointer: fine)").matches;
var DPR = Math.min(devicePixelRatio || 1, 2);
function size(){
  cvs.width = innerWidth * DPR; cvs.height = innerHeight * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);      // canvas resize resets context state — re-apply both
  ctx.globalCompositeOperation = "lighter";    // dark bg: smoke adds light
}
size(); addEventListener("resize", size);

/* ---- sprite atlas: 12 lumpy soft puffs, rendered once (never per-frame gradients) ---- */
var SPRITES = [];
(function bakeSprites(){
  for (var i = 0; i < 12; i++){
    var s = document.createElement("canvas");
    s.width = s.height = 64;
    var g = s.getContext("2d");
    function blob(x, y, r, a){
      var rg = g.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, "rgba(238,228,212," + a + ")");
      rg.addColorStop(0.55, "rgba(238,228,212," + (a * 0.45) + ")");
      rg.addColorStop(1, "rgba(238,228,212,0)");
      g.fillStyle = rg;
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    }
    blob(32, 32, 30, 0.5);
    var n = 3 + (i % 3);
    for (var j = 0; j < n; j++){
      var an = (i * 2.399 + j * 2.2), d = 8 + (j % 3) * 4;
      blob(32 + Math.cos(an) * d, 32 + Math.sin(an) * d, 12 + (j % 2) * 7, 0.22);
    }
    SPRITES.push(s);
  }
})();

/* kirakira spark sprites for the ember flecks (same recipe as the garden trail) */
var SPK = (function () {
  var variants = [{ R: 22, h: 0.5 }, { R: 15, h: 0.55 }, { R: 15, h: 0.68 }];
  return variants.map(function (v) {
    var s = document.createElement("canvas"); s.width = s.height = 48;
    var g = s.getContext("2d"), cx = 24, cy = 24, k = 0.18 * v.R;
    var bg = g.createRadialGradient(cx, cy, 0, cx, cy, 24);
    bg.addColorStop(0, "rgba(235,205,150,0.22)"); bg.addColorStop(1, "rgba(235,205,150,0)");
    g.fillStyle = bg; g.fillRect(0, 0, 48, 48);
    g.fillStyle = "rgba(255,230,180,0.9)";
    g.beginPath();
    g.moveTo(cx, cy - v.R);
    g.quadraticCurveTo(cx + k, cy - k, cx + v.R * v.h, cy);
    g.quadraticCurveTo(cx + k, cy + k, cx, cy + v.R * 0.8);
    g.quadraticCurveTo(cx - k, cy + k, cx - v.R * v.h, cy);
    g.quadraticCurveTo(cx - k, cy - k, cx, cy - v.R);
    g.fill();
    var cg = g.createRadialGradient(cx, cy, 0, cx, cy, 4);
    cg.addColorStop(0, "rgba(255,247,230,0.95)"); cg.addColorStop(1, "rgba(255,220,150,0)");
    g.fillStyle = cg; g.beginPath(); g.arc(cx, cy, 4, 0, Math.PI * 2); g.fill();
    return s;
  });
})();

/* ---- particle pool: fixed ring, oldest evicted on spawn ---- */
var RING = 240, pool = [], head = 0, seq = 0;
for (var i = 0; i < RING; i++) pool.push({ x: 0, y: 0, vx: 0, vy: 0, life: 0, decay: 0.008, r0: 2, rot: 0, rotV: 0, spr: 0, stream: 0, ph: 0, ab: 0.14 });

function puff(x, y, svx, svy){
  var p = pool[head]; head = (head + 1) % RING; seq++;
  p.x = x; p.y = y;
  p.vx = svx * 0.10 + (Math.random() - 0.5) * 0.24;   // inherit a whiff of the stroke, damped below
  p.vy = svy * 0.10 - 0.3 + (Math.random() - 0.5) * 0.12;
  p.life = 1;
  p.decay = 0.008 + Math.random() * 0.006;            // ~1.2 – 2 s: wisps vanish noticeably fast
  p.r0 = 1.6 + Math.random() * 2.4;
  p.rot = Math.random() * Math.PI * 2;
  p.rotV = (Math.random() - 0.5) * 0.02;
  p.spr = (Math.random() * SPRITES.length) | 0;
  p.stream = (seq % 3) - 1;                           // three wisp streams
  p.ph = Math.random() * Math.PI * 2;
  p.ab = 0.16 + Math.random() * 0.16;                 // base alpha — low, overlaps do the glowing
}

/* ---- events only record the pointer; all spawning happens inside the rAF frame ---- */
var tX = -1, tY = -1, sX = -1, sY = -1, have = false, idleAcc = 0;
if (finePtr){
  addEventListener("pointermove", function(e){ tX = e.clientX; tY = e.clientY; have = true; }, { passive: true });
  addEventListener("pointerleave", function(){ have = false; sX = sY = -1; });
}

function simulate(t, dt){
  /* spawn exactly along this frame's stroke, one stamp every ~6 px */
  if (have){
    if (sX < 0){ sX = tX; sY = tY; }
    var steps = 0;
    for (;;){
      var dx = tX - sX, dy = tY - sY, d = Math.hypot(dx, dy);
      if (d < 6) break;
      sX += dx * (6 / d); sY += dy * (6 / d);
      var copies = Math.min(3, 1 + ((d / 25) | 0));    // faster stroke → thicker ribbon
      for (var cpi = 0; cpi < copies; cpi++)
        puff(sX + (Math.random() - 0.5) * 7, sY + (Math.random() - 0.5) * 7, dx, dy);
      if (++steps >= 20){ sX = tX; sY = tY; break; }   // pointer warped: just catch up
    }
    /* idle cursor → a single thin standing filament, never a bubble field */
    if (Math.hypot(tX - sX, tY - sY) < 2){
      idleAcc += dt;
      if (idleAcc >= 8){ idleAcc = 0; puff(tX + (Math.random() - 0.5) * 2.4, tY + (Math.random() - 0.5) * 2.4, 0, -0.2); }
    } else idleAcc = 0;
  }
  var t2 = t * 0.0002;
  for (var i = 0; i < RING; i++){
    var p = pool[i];
    if (p.life <= 0) continue;
    p.life -= p.decay * dt;
    if (p.life <= 0){ p.life = 0; continue; }
    var age = 1 - p.life;
    p.vx *= Math.pow(0.93, dt); p.vy *= Math.pow(0.93, dt);            // stroke kick dies in ~0.15 s — short drag
    if (age < 0.3){ p.vy -= 0.012 * dt; if (p.vy < -0.4) p.vy = -0.4; }  // brief buoyancy only
    /* curl-ish turbulence: per-particle phase + position-scaled field,
       strength ramps with age (young = coherent filament, old = dispersed) */
    var turb = Math.min(age / 0.4, 1) * 0.05 * dt;
    var a2 = Math.sin(p.x * 0.0075 + t2 * 1.3 + p.ph) + Math.cos(p.y * 0.0062 - t2 + p.ph);
    p.vx += Math.cos(a2 * 2.1) * turb;
    p.vy += Math.sin(a2 * 2.1) * turb;
    p.x += (p.vx + p.stream * 0.25 * Math.sin(age * 2.51 + p.ph) + 0.35 * Math.sin(t * 0.0008 + p.ph)) * dt;
    p.y += p.vy * dt;
    p.rot += p.rotV * dt;
  }
}

function drawAll(){
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  for (var i = 0; i < RING; i++){
    var p = pool[i];
    if (p.life <= 0) continue;
    var age = 1 - p.life;
    var r = p.r0 + 26 * Math.pow(age, 0.85);           // grows with age — smoke, not bubbles
    var aIn = age < 0.08 ? age / 0.08 : 1;             // fast fade-in envelope
    var alpha = Math.min(0.9, aIn * Math.pow(1 - age, 1.8) * p.ab / Math.sqrt(r / p.r0));
    if (alpha <= 0.003) continue;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = alpha;
    ctx.drawImage(SPRITES[p.spr], -r, -r, r * 2, r * 2);
    ctx.restore();
    /* golden ember fleck — a small kirakira spark sprite riding inside the wisp */
    if (age < 0.35){
      var sa = Math.min(age / 0.05, 1) * Math.pow(1 - age, 2) * 0.9;
      var esc = (p.r0 * 1.6) / 24;
      ctx.globalAlpha = sa * (0.75 + 0.25 * Math.sin(age * 30 + p.ph));
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * 2);
      ctx.drawImage(SPK[p.spr % SPK.length], -24 * esc, -24 * esc, 48 * esc, 48 * esc);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }
}

if (reduced){
  /* frozen wisp: run a fixed emitter for a while, draw once, stop */
  tX = tY = -1; have = false;
  var rt = 0;
  for (var z = 0; z < 220; z++){ rt += 16.7; idleAcc = 7 * z; have = true; sX = tX = innerWidth * 0.5; sY = tY = innerHeight * 0.55; simulate(rt, 1); }
  drawAll();
} else {
  var last = performance.now();
  requestAnimationFrame(function loop(t){
    t = t || performance.now();
    var dt = Math.min((t - last) / 16.7, 3);   // clamp: no lurch after a background tab
    last = t;
    simulate(t, dt); drawAll();
    requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
